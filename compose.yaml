services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env before starting PostgreSQL}
            POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env before starting PostgreSQL}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting PostgreSQL}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres_data:
