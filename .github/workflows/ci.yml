name: CI

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Lint, typecheck, test, and build
        runs-on: ubuntu-latest
        env:
            HUSKY: 0
            DATABASE_URL: postgresql://enterprise_kb:local_dev_password@localhost:5432/enterprise_kb
            REDIS_URL: redis://:local_dev_redis_password@localhost:6379
            ACCESS_TOKEN_SECRET: local-development-only-access-token-secret-change-before-deployment
            REFRESH_TOKEN_SECRET: local-development-only-refresh-token-secret-change-before-deployment
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: enterprise_kb
                    POSTGRES_USER: enterprise_kb
                    POSTGRES_PASSWORD: local_dev_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U enterprise_kb -d enterprise_kb"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7.2-alpine
                env:
                    REDIS_PASSWORD: local_dev_redis_password
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "REDISCLI_AUTH=local_dev_redis_password redis-cli ping | grep -q PONG"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply Prisma migrations
              run: |
                  if find apps/server/prisma/migrations -mindepth 2 -name migration.sql -print -quit | grep -q .; then
                      pnpm --filter @kb/server db:migrate:deploy
                  else
                      echo "No application migrations found; skipping deployment."
                  fi

            - name: Lint commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm format:check

            - name: Typecheck workspaces
              run: pnpm typecheck

            - name: Test workspaces
              run: pnpm test

            - name: Build workspaces
              run: pnpm build
